<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子合約簽署</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#f5f5f5;min-height:100vh}
.top-bar{background:#1a1a2e;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.top-bar h1{font-size:16px;font-weight:600;flex:1}
.badge{background:rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.btn-primary{background:#4f8ef7;color:#fff}
.btn-primary:hover{background:#3a7de0}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-danger{background:#ef4444;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.layout{display:flex;gap:0;min-height:calc(100vh - 52px)}
.sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;padding:20px;flex-shrink:0;overflow-y:auto}
.sidebar h2{font-size:13px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
.info-row{margin-bottom:12px}
.info-row label{font-size:11px;color:#9ca3af;display:block;margin-bottom:2px}
.info-row span{font-size:14px;color:#111;font-weight:500}
.divider{height:1px;background:#f3f4f6;margin:16px 0}

.sig-list{display:flex;flex-direction:column;gap:8px}
.sig-item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
.sig-item:hover{border-color:#4f8ef7;background:#f8faff}
.sig-item.done{border-color:#22c55e;background:#f0fdf4}
.sig-item .sig-label{font-size:13px;font-weight:500;color:#374151}
.sig-item .sig-status{font-size:11px;color:#9ca3af;margin-top:2px}
.sig-item.done .sig-status{color:#16a34a}

.main{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.page-wrap{position:relative;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.page-wrap canvas{display:block}
.sig-overlay{position:absolute;border:2px dashed #4f8ef7;border-radius:6px;background:rgba(79,142,247,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.sig-overlay:hover{background:rgba(79,142,247,.15)}
.sig-overlay.signed{border:2px solid #22c55e;background:rgba(34,197,94,.06);cursor:default}
.sig-overlay span{font-size:11px;color:#4f8ef7;font-weight:500;pointer-events:none}
.sig-overlay.signed span{color:#16a34a}
.sig-overlay img{width:100%;height:100%;object-fit:contain;pointer-events:none}

/* Signature Pad Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;display:none}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:480px;max-width:95vw}
.modal h3{font-size:16px;font-weight:700;margin-bottom:6px}
.modal p{font-size:12px;color:#6b7280;margin-bottom:16px}
#sig-canvas{border:1.5px solid #d1d5db;border-radius:10px;display:block;touch-action:none;background:#fafafa;cursor:crosshair}
.modal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.btn-ghost{background:transparent;border:1px solid #d1d5db;color:#374151}
.btn-ghost:hover{background:#f9fafb}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:12px;color:#6b7280}
.spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#4f8ef7;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;right:24px;background:#1f2937;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="top-bar">
  <h1>電子合約簽署</h1>
  <span class="badge" id="room-badge">載入中...</span>
  <button class="btn btn-outline" onclick="window.close()" style="font-size:12px;padding:6px 12px;">關閉</button>
  <button class="btn btn-primary" id="submit-btn" onclick="submitContract()" disabled>確認完成並上傳</button>
</div>

<div class="layout">
  <div class="sidebar">
    <h2>房間資訊</h2>
    <div class="info-row"><label>房號</label><span id="s-room">—</span></div>
    <div class="info-row"><label>地址</label><span id="s-addr">—</span></div>
    <div class="info-row"><label>承租人</label><span id="s-tenant">—</span></div>
    <div class="info-row"><label>入住日期</label><span id="s-checkin">—</span></div>
    <div class="info-row"><label>退租日期</label><span id="s-checkout">—</span></div>
    <div class="info-row"><label>月租金</label><span id="s-rent">—</span></div>
    <div class="info-row"><label>押金</label><span id="s-deposit">—</span></div>
    <div class="divider"></div>
    <h2>簽名欄位</h2>
    <div class="sig-list" id="sig-list"></div>
    <div class="divider"></div>
    <p style="font-size:11px;color:#9ca3af;line-height:1.6;">所有欄位簽名後，點右上角「確認完成並上傳」，合約將存入系統。</p>
  </div>
  <div class="main" id="pdf-main">
    <div class="loading"><div class="spinner"></div><span>載入合約中...</span></div>
  </div>
</div>

<!-- Signature Pad Modal -->
<div class="modal-bg" id="sig-modal">
  <div class="modal">
    <h3 id="sig-modal-title">承租人簽名</h3>
    <p>請在下方框內用滑鼠或手指簽名</p>
    <canvas id="sig-canvas" width="430" height="150"></canvas>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="clearSig()">清除重簽</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="closeSigModal()">取消</button>
        <button class="btn btn-primary" onclick="saveSig()">確認簽名</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──
const SUPA_URL = 'https://fuvfvfmprxnhwxkexmtr.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1dmZ2Zm1wcnhuaHd4a2V4bXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NjYxMTMsImV4cCI6MjA5MjM0MjExM30.ng7GT-watoOSlNhUTsGjloYvDdeKQsvZVLzHipJk9FY';
const TEMPLATE_URL = 'https://fuvfvfmprxnhwxkexmtr.supabase.co/storage/v1/object/public/contracts/addr1.pdf';

// PDF pt: 612 x 792, origin bottom-left
// Signature zones: [page(0-indexed), x, y_from_bottom, width, height, label, field_id]
const SIG_ZONES = [
  { page:0, x:265, yb:700, w:200, h:40, label:'承租人簽章（審閱欄）', id:'sig_review' },
  { page:0, x:155, yb:678, w:220, h:40, label:'立約書人承租人簽名', id:'sig_party' },
  { page:3, x:75,  yb:688, w:230, h:40, label:'承租人姓名（第4頁）', id:'sig_p4_name' },
];

// ── State ──
const db = supabase.createClient(SUPA_URL, SUPA_KEY);
const params = new URLSearchParams(location.search);
const roomId = params.get('roomId');
let room = null;
let pdfDoc = null; // pdf-lib PDFDocument
let pdfjsDoc = null;
let signatures = {}; // {id: dataURL}
let currentSigId = null;
let pageCanvases = {};

// Signature pad state
let sigPainting = false, sigCtx = null, sigCanvas = null;

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Init ──
async function init(){
  if(!roomId){ document.getElementById('pdf-main').innerHTML='<div class="loading"><span>⚠ 缺少 roomId 參數</span></div>'; return; }
  try{
    const {data} = await db.from('test_rooms').select('*').eq('id',roomId).single();
    room = data;
    if(!room){ throw new Error('找不到房間'); }
    fillSidebar();
    renderSigList();
    await loadPDF();
  }catch(e){
    document.getElementById('pdf-main').innerHTML=`<div class="loading"><span>❌ ${e.message}</span></div>`;
  }
}

function fillSidebar(){
  document.getElementById('s-room').textContent = room.name||'—';
  document.getElementById('s-addr').textContent = room.addr||'—';
  document.getElementById('s-tenant').textContent = room.tenant||'—';
  document.getElementById('s-checkin').textContent = room.checkin||'—';
  document.getElementById('s-checkout').textContent = room.checkout||'—';
  document.getElementById('s-rent').textContent = room.rent?'$'+Number(room.rent).toLocaleString():'—';
  document.getElementById('s-deposit').textContent = room.deposit?'$'+Number(room.deposit).toLocaleString():'—';
  document.getElementById('room-badge').textContent = `${room.addr||''} ${room.name||''}`;
}

function renderSigList(){
  const el = document.getElementById('sig-list');
  el.innerHTML = SIG_ZONES.map(z=>`
    <div class="sig-item" id="list-${z.id}" onclick="scrollToSig('${z.id}')">
      <div class="sig-label">${z.label}</div>
      <div class="sig-status">點擊欄位開始簽名</div>
    </div>`).join('');
}

async function loadPDF(){
  const main = document.getElementById('pdf-main');
  main.innerHTML = '<div class="loading"><div class="spinner"></div><span>載入合約...</span></div>';

  // Load via pdf.js for rendering
  const res = await fetch(TEMPLATE_URL);
  const buf = await res.arrayBuffer();
  pdfjsDoc = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
  // Load via pdf-lib for editing
  pdfDoc = await PDFLib.PDFDocument.load(buf);

  main.innerHTML = '';
  const scale = Math.min(window.innerWidth > 900 ? 1.2 : 0.9, 1.5);

  for(let i=0; i<pdfjsDoc.numPages; i++){
    const page = await pdfjsDoc.getPage(i+1);
    const vp = page.getViewport({scale});
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    wrap.style.width = vp.width+'px';
    wrap.style.height = vp.height+'px';
    const cv = document.createElement('canvas');
    cv.width = vp.width; cv.height = vp.height;
    const ctx = cv.getContext('2d');
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    wrap.appendChild(cv);
    pageCanvases[i] = {wrap, scale, vp, pdfPage: page};
    // Add signature overlays for this page
    SIG_ZONES.filter(z=>z.page===i).forEach(z=>addSigOverlay(z, wrap, scale, vp.height));
    main.appendChild(wrap);
  }
}

function pdfToCanvas(x, yb, w, h, scale, canvasH, pdfH=792){
  // PDF: origin bottom-left. Canvas: origin top-left.
  const cx = x * scale;
  const cy = canvasH - (yb + h) * scale;
  return { cx, cy, cw: w*scale, ch: h*scale };
}

function addSigOverlay(z, wrap, scale, canvasH){
  const {cx,cy,cw,ch} = pdfToCanvas(z.x, z.yb, z.w, z.h, scale, canvasH);
  const div = document.createElement('div');
  div.className = 'sig-overlay';
  div.id = 'overlay-'+z.id;
  div.style.cssText = `left:${cx}px;top:${cy}px;width:${cw}px;height:${ch}px`;
  div.innerHTML = `<span>✍ 點擊簽名</span>`;
  div.onclick = ()=> openSigModal(z);
  wrap.appendChild(div);
}

function scrollToSig(id){
  const el = document.getElementById('overlay-'+id);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

// ── Signature Pad ──
function openSigModal(zone){
  if(signatures[zone.id]){
    // Already signed - ask to redo
    if(!confirm('已有簽名，要重新簽名嗎？')) return;
    delete signatures[zone.id];
    updateOverlay(zone.id, null);
  }
  currentSigId = zone.id;
  document.getElementById('sig-modal-title').textContent = zone.label;
  document.getElementById('sig-modal').classList.add('open');
  sigCanvas = document.getElementById('sig-canvas');
  sigCtx = sigCanvas.getContext('2d');
  clearSig();
  // Touch & Mouse events
  sigCanvas.onmousedown = startDraw;
  sigCanvas.onmousemove = draw;
  sigCanvas.onmouseup = stopDraw;
  sigCanvas.onmouseleave = stopDraw;
  sigCanvas.ontouchstart = e=>{ e.preventDefault(); startDraw(e.touches[0]); };
  sigCanvas.ontouchmove = e=>{ e.preventDefault(); draw(e.touches[0]); };
  sigCanvas.ontouchend = stopDraw;
}

function closeSigModal(){ document.getElementById('sig-modal').classList.remove('open'); currentSigId=null; }
function clearSig(){ if(sigCtx){ sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); sigCtx.fillStyle='#fafafa'; sigCtx.fillRect(0,0,sigCanvas.width,sigCanvas.height); sigPainting=false; } }

function startDraw(e){ sigPainting=true; const r=sigCanvas.getBoundingClientRect(); sigCtx.beginPath(); sigCtx.moveTo(e.clientX-r.left, e.clientY-r.top); }
function draw(e){ if(!sigPainting) return; const r=sigCanvas.getBoundingClientRect(); sigCtx.lineWidth=2.5; sigCtx.lineCap='round'; sigCtx.strokeStyle='#1a1a2e'; sigCtx.lineTo(e.clientX-r.left, e.clientY-r.top); sigCtx.stroke(); }
function stopDraw(){ sigPainting=false; }

function saveSig(){
  // Check if anything drawn
  const d = sigCtx.getImageData(0,0,sigCanvas.width,sigCanvas.height).data;
  const hasContent = Array.from(d).some((v,i)=>i%4===3&&v>0);
  if(!hasContent){ toast('請先簽名'); return; }
  const dataURL = sigCanvas.toDataURL('image/png');
  signatures[currentSigId] = dataURL;
  updateOverlay(currentSigId, dataURL);
  updateSigList(currentSigId);
  closeSigModal();
  checkAllSigned();
}

function updateOverlay(id, dataURL){
  const el = document.getElementById('overlay-'+id);
  if(!el) return;
  if(dataURL){
    el.classList.add('signed');
    el.innerHTML = `<img src="${dataURL}" alt="簽名">`;
    el.onclick = ()=>{ const z=SIG_ZONES.find(z=>z.id===id); if(z) openSigModal(z); };
  } else {
    el.classList.remove('signed');
    el.innerHTML = `<span>✍ 點擊簽名</span>`;
  }
}

function updateSigList(id){
  const item = document.getElementById('list-'+id);
  if(!item) return;
  item.classList.add('done');
  item.querySelector('.sig-status').textContent = '✓ 已簽名';
}

function checkAllSigned(){
  const allDone = SIG_ZONES.every(z=>signatures[z.id]);
  document.getElementById('submit-btn').disabled = !allDone;
}

// ── Generate & Upload ──
async function submitContract(){
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '處理中...';
  try{
    const pages = pdfDoc.getPages();

    for(const z of SIG_ZONES){
      const sigDataURL = signatures[z.id];
      if(!sigDataURL) continue;
      const page = pages[z.page];
      const {height: pdfH} = page.getSize();
      // Embed signature image
      const imgBytes = await fetch(sigDataURL).then(r=>r.arrayBuffer());
      const img = await pdfDoc.embedPng(imgBytes);
      page.drawImage(img, {x:z.x, y:z.yb, width:z.w, height:z.h});
    }

    // Auto-fill tenant info on page 4
    const p4 = pages[3];
    const {height: p4H} = p4.getSize();
    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const drawText = (page, text, x, yb, size=11)=>{
      page.drawText(text, {x, y:yb, size, font, color:PDFLib.rgb(0,0,0.4)});
    };
    if(room.tenant) drawText(p4, room.tenant, 80, 696);
    if(room.phone) drawText(p4, room.phone, 480, 658);

    const signedBytes = await pdfDoc.save();
    const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
    const fileName = `signed/${roomId}_${ts}.pdf`;
    const {data, error} = await db.storage.from('contracts').upload(fileName, signedBytes, {
      contentType:'application/pdf', upsert:true
    });
    if(error) throw error;

    const publicURL = `${SUPA_URL}/storage/v1/object/public/contracts/${fileName}`;
    await db.from('test_rooms').update({
      contract_url: publicURL,
      contract_signed_at: new Date().toISOString()
    }).eq('id', roomId);

    toast('✅ 合約上傳成功！');
    btn.textContent = '✅ 上傳完成';
    // Show download link
    const main = document.getElementById('pdf-main');
    const banner = document.createElement('div');
    banner.style.cssText='position:sticky;top:0;background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:14px 20px;margin-bottom:12px;display:flex;align-items:center;gap:12px;width:100%;max-width:800px';
    banner.innerHTML=`<span style="font-size:14px;font-weight:600;color:#166534">✅ 合約已成功上傳</span><a href="${publicURL}" target="_blank" style="margin-left:auto;background:#16a34a;color:#fff;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px">下載 PDF</a>`;
    main.insertBefore(banner, main.firstChild);
  }catch(e){
    toast('❌ 上傳失敗：'+e.message);
    btn.disabled=false; btn.textContent='確認完成並上傳';
  }
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
</body>
</html>
